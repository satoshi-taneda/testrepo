---
# ========================================
# サーバグループ追加用変数
# ========================================
VAR_servergroup_name_1: "グループ1"
VAR_servergroup_comment_1: "コメント1"


# ========================================
# フェイルオーバ属性(拡張)用変数
# ========================================
VAR_failover_group_autonomic_blacklist_use: 0         # パラメータ/me指定したモニタリソースで異常を検出しているサーバーをフェイルオーバ先から除外する
                                                      #   (1: 除外する, 0: 除外しない(既定値))

VAR_failover_group_functype_1: "awsazw"               # パラメータ/モニタリソースタイプ1 (例 AWS AZモニタ
VAR_failover_group_functype_2: "awsdnsw"              # パラメータ/モニタリソースタイプ2 (例 AWS DNSモニタ
                                                      # (!) 「指定したモニタリソースで異常を検出しているサーバをフェイルオーバ先から除外する」
                                                      # の設定が「除外する」の場合に設定
VAR_failover_group_functype_name: "functype_name"     # パラメータ/モニタリソースグループ/追加する
VAR_failover_group_autonomic_forceto_use: 0           # パラメータ/全てのサーバで異常を検出している場合、異常を無視してフェイルオーバを行う
                                                      # (1: フェイルオーバを行う, 0: フェイルオーバを行わない(既定値))
VAR_failover_group_failback: 0                        # パラメータ/フェイルバック属性(1: 自動フェイルバック, 0: 手動フェイルバック(既定値))

















